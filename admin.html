<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B.S.A.S. | 관리자 통계</title>
<style>
:root{font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;color:#1e3430;background:#f4f8f3}*{box-sizing:border-box}body{margin:0}main{max-width:1050px;margin:0 auto;padding:32px 18px 80px}.head{display:flex;justify-content:space-between;align-items:center;gap:16px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.16em;color:#55936c}h1{margin:7px 0 6px;font-size:clamp(24px,4vw,34px)}p{color:#61746a}section,.stat{background:white;border:1px solid #e2eae0;border-radius:19px;padding:25px;box-shadow:0 8px 28px #233f2410}.login{max-width:440px;margin:65px auto}label{display:block;font-size:13px;font-weight:700;margin:18px 0 7px}input{width:100%;padding:13px;border:1px solid #cdd9ce;border-radius:10px;font:inherit}button{border:0;border-radius:11px;padding:12px 19px;background:#38875d;color:white;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.ghost{background:#e6efe8;color:#276c47}.login button{width:100%;margin-top:20px}.error{color:#bd3636;font-size:13px;white-space:pre-wrap}.muted{font-size:13px;color:#74857a}.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:22px 0}.stat strong{display:block;font-size:29px;margin-top:10px}.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}.bar-row{display:grid;grid-template-columns:92px 1fr 45px;align-items:center;gap:10px;margin:12px 0;font-size:13px}.bar-bg{height:12px;background:#edf3ec;border-radius:99px;overflow:hidden}.bar{height:100%;background:#71b98a;border-radius:99px}.bar-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:11px 6px;border-bottom:1px solid #eef1ec}th{color:#738376}footer{margin-top:20px;font-size:12px;color:#87998d}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.stat strong{font-size:24px}.bar-row{grid-template-columns:85px 1fr 32px}}
</style></head><body><main>
<div class="head"><div><div class="eyebrow">B.S.A.S. · HIDDEN WINGS</div><h1>관리자 통계 대시보드</h1><p>숨겨진 날개 테스트 참여 현황</p></div><button id="logout" class="ghost hidden">로그아웃</button></div>
<section id="login" class="login"><h2>관리자 로그인 🔐</h2><p class="muted">Supabase에 등록된 관리자 계정으로 로그인하세요.</p><form id="loginForm"><label for="email">이메일</label><input id="email" type="email" autocomplete="username" required><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" required><button id="loginBtn">로그인</button></form><p id="loginError" class="error" role="alert"></p></section>
<div id="dashboard" class="hidden"><div class="stats"><div class="stat"><span class="muted">총 검사 완료</span><strong id="total">-</strong></div><div class="stat"><span class="muted">결과가 나온 새 유형</span><strong id="types">-</strong></div><div class="stat"><span class="muted">최다 결과 유형</span><strong id="top">-</strong></div></div><div class="grid"><section><h2>🐦 새 유형별 검사 결과</h2><p class="muted">유형 번호 0~15 · 16종</p><div id="bars"></div></section><section><h2>📅 날짜별 검사 완료</h2><p class="muted">한국 시간 기준</p><table><thead><tr><th>날짜</th><th>완료 건수</th></tr></thead><tbody id="daily"></tbody></table></section></div><footer>데이터는 Supabase에서 불러옵니다. 새 검사 결과를 확인하려면 <button class="ghost" id="refresh">새로고침</button></footer><p id="dataError" class="error" role="alert"></p></div>
</main><script>
'use strict';
// 공개 가능한 Supabase 프로젝트 URL과 publishable key만 사용합니다.
// sb_secret_... 또는 service_role 키는 절대 이 파일에 넣지 마세요.
const SUPABASE_URL='https://apqgmcdkcticpfzwcogj.supabase.co';
const SUPABASE_KEY='sb_publishable_qAjty4U30JGdad96wAPAGA_ylyuQU21';
const $=id=>document.getElementById(id);
let accessToken=null;
async function api(path,opts={}){const res=await fetch(SUPABASE_URL+path,{...opts,headers:{apikey:SUPABASE_KEY,...(accessToken?{Authorization:'Bearer '+accessToken}:{}),'Content-Type':'application/json',...opts.headers}});const txt=await res.text();let data;try{data=txt?JSON.parse(txt):null}catch{data=txt}if(!res.ok)throw new Error((data&&data.message)||`HTTP ${res.status}`);return data}
function showDashboard(){ $('login').classList.add('hidden');$('dashboard').classList.remove('hidden');$('logout').classList.remove('hidden') }
function showLogin(){accessToken=null;$('dashboard').classList.add('hidden');$('logout').classList.add('hidden');$('login').classList.remove('hidden');$('password').value=''}
async function loadStats(){ $('dataError').textContent='';try{
// RLS restricts rows to authorized administrators.
const all=[];let from=0;const pageSize=1000;while(true){const batch=await api(`/rest/v1/bird_results?select=id,bird_index,completed_at&order=id.asc&offset=${from}&limit=${pageSize}`);all.push(...batch);if(batch.length<pageSize)break;from+=pageSize;if(from>100000)throw new Error('데이터가 많습니다. 통계 API를 별도로 구성해 주세요.')}
const counts=Array(16).fill(0),dates={};for(const r of all){if(Number.isInteger(r.bird_index)&&r.bird_index>=0&&r.bird_index<16)counts[r.bird_index]++;const d=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(r.completed_at));dates[d]=(dates[d]||0)+1}
$('total').textContent=all.length.toLocaleString('ko-KR')+'건';$('types').textContent=counts.filter(Boolean).length+' / 16종';const max=Math.max(...counts);$('top').textContent=max?`유형 ${counts.indexOf(max)} (${max}건)`:'-';
$('bars').replaceChildren();counts.forEach((n,i)=>{const row=document.createElement('div');row.className='bar-row';const label=document.createElement('span');label.className='bar-label';label.textContent=`유형 ${i}`;const bg=document.createElement('div');bg.className='bar-bg';const bar=document.createElement('div');bar.className='bar';bar.style.width=(max?100*n/max:0)+'%';bg.append(bar);const count=document.createElement('strong');count.textContent=n+'건';row.append(label,bg,count);$('bars').append(row)});
$('daily').replaceChildren();Object.keys(dates).sort().reverse().forEach(d=>{const tr=document.createElement('tr'),a=document.createElement('td'),b=document.createElement('td');a.textContent=d;b.textContent=dates[d]+'건';tr.append(a,b);$('daily').append(tr)});if(!all.length)$('daily').innerHTML='<tr><td colspan="2">아직 검사 결과가 없습니다.</td></tr>';
}catch(e){$('dataError').textContent='통계 조회 실패: '+e.message+' (관리자 SELECT 권한과 정책을 확인하세요.)'}}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginError').textContent='';$('loginBtn').disabled=true;try{const session=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});accessToken=session.access_token;const membership=await api('/rest/v1/bird_admins?select=user_id&limit=1');if(!Array.isArray(membership)||membership.length===0)throw new Error('관리자 권한이 없는 계정입니다.');showDashboard();await loadStats()}catch(err){showLogin();$('loginError').textContent='로그인 실패: '+err.message}finally{$('loginBtn').disabled=false}});
$('logout').addEventListener('click',showLogin);$('refresh').addEventListener('click',loadStats);
</script></body></html>
